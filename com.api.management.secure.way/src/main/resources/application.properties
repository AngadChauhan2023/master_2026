spring.application.name=com.api.management.secure.way
server.port=8081
#database configuration
spring.datasource.name=api_manager
spring.datasource.url=jdbc:mysql://localhost:3306/api_manager
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#data jpa configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

jwt.secret=mysecretkeymysecretkeymysecretkey
jwt.expiration=3600000
jwt.refresh-expiration=86400000

spring.main.allow-circular-references=true
